<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>超清大片 · Liquid Glass</title>
<style>
  
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
    background: #07070e;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 背景：彩色光斑 + 毛玻璃感 ===== */
  .bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .8;
    will-change: transform;
    animation: float 20s ease-in-out infinite;
  }

  .blob:nth-child(1) { width: 520px; height: 520px; background: #7c3aed; top: -140px; left: -120px; animation-delay: 0s; }
  .blob:nth-child(2) { width: 480px; height: 480px; background: #06b6d4; bottom: -160px; right: -130px; animation-delay: -6s; }
  .blob:nth-child(3) { width: 420px; height: 420px; background: #f43f5e; top: 35%; left: 58%; animation-delay: -12s; }
  .blob:nth-child(4) { width: 400px; height: 400px; background: #22c55e; bottom: 5%; left: 8%; animation-delay: -3s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(70px, -55px) scale(1.15); }
    66%      { transform: translate(-50px, 45px) scale(.9); }
  }

  
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, transparent 35%, rgba(0, 0, 0, .6) 100%);
    pointer-events: none;
  }


  .card {
    position: relative;
    z-index: 1;
    width: min(430px, 100%);
    padding: 52px 38px;
    text-align: center;
    border-radius: 34px;
    border: 1px solid rgba(255, 255, 255, .28);
    background: linear-gradient(150deg,
                rgba(255, 255, 255, .22) 0%,
                rgba(255, 255, 255, .08) 45%,
                rgba(255, 255, 255, .14) 100%);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    box-shadow:
      0 30px 70px rgba(0, 0, 0, .45),
      0 2px 6px rgba(0, 0, 0, .2),
      inset 0 1px 1px rgba(255, 255, 255, .55),
      inset 0 -1px 1px rgba(255, 255, 255, .12);
  }

 
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 14%; right: 14%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .95), transparent);
    pointer-events: none;
  }

 
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(120% 80% at 50% 0%, rgba(255, 255, 255, .2), transparent 62%);
    pointer-events: none;
  }

  .card-inner { position: relative; z-index: 1; }

  .card h1 {
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 700;
    letter-spacing: .03em;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .3);
  }

  .card p {
    margin-top: 14px;
    font-size: 14px;
    line-height: 1.75;
    color: rgba(255, 255, 255, .75);
  }

  
  .liquid-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 34px;
    padding: 16px 42px;
    border-radius: 999px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .04em;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .3);

    
    background: linear-gradient(180deg,
                rgba(255, 255, 255, .45) 0%,
                rgba(255, 255, 255, .16) 48%,
                rgba(255, 255, 255, .1) 100%);
    backdrop-filter: blur(14px) saturate(200%);
    -webkit-backdrop-filter: blur(14px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, .55);
    box-shadow:
      0 10px 28px rgba(0, 0, 0, .35),
      0 2px 6px rgba(0, 0, 0, .18),
      inset 0 1px 1px rgba(255, 255, 255, .95),
      inset 0 -8px 18px rgba(255, 255, 255, .12),
      inset 0 -1px 2px rgba(255, 255, 255, .5);

    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .3s ease,
                background .3s ease;
  }

 
  .liquid-btn::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 9%;
    right: 9%;
    height: 48%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0));
    filter: blur(.5px);
    pointer-events: none;
  }

  
  .liquid-btn::after {
    content: "";
    position: absolute;
    top: -60%;
    left: -70%;
    width: 50%;
    height: 220%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .7), transparent);
    transform: rotate(20deg);
    filter: blur(6px);
    pointer-events: none;
    transition: left .75s cubic-bezier(.4, 0, .2, 1);
  }

  .liquid-btn:hover {
    transform: translateY(-3px) scale(1.035);
    background: linear-gradient(180deg,
                rgba(255, 255, 255, .55) 0%,
                rgba(255, 255, 255, .22) 48%,
                rgba(255, 255, 255, .14) 100%);
    box-shadow:
      0 18px 42px rgba(0, 0, 0, .42),
      0 0 26px rgba(255, 255, 255, .22),
      inset 0 1px 1px rgba(255, 255, 255, 1),
      inset 0 -10px 22px rgba(255, 255, 255, .2),
      inset 0 -1px 2px rgba(255, 255, 255, .6);
  }

  .liquid-btn:hover::after { left: 130%; }

  .liquid-btn:active { transform: translateY(-1px) scale(.99); }

  .liquid-btn:focus-visible {
    outline: 2px solid rgba(255, 255, 255, .9);
    outline-offset: 3px;
  }

  
  .liquid-btn span {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .liquid-btn, .liquid-btn::after { transition: none; }
  }
</style>
</head>
<body>

  
  <div class="bg">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="vignette"></div>
  </div>

  <!-- 毛玻璃卡片 -->
  <main class="card">
    <div class="card-inner">
      <h1>超清大片</h1>
      <p>点击免费观看超清电影</p>

      <!-- ▼▼▼ 把 href 换成你自己的链接 ▼▼▼ -->
      <a class="liquid-btn" href="https://vdse.bdstatic.com//192d9a98d782d9c74c96f09db9378d93.mp4" target="_blank" rel="noopener">
        <span>点击跳转 →</span>
      </a>
      <!-- ▲▲▲ 把 href 换成你自己的链接 ▲▲▲ -->
    </div>
  </main>

</body>
</html>
